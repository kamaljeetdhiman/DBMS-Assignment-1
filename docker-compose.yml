version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: g13-postgres
    environment:
      POSTGRES_USER: dbms_user
      POSTGRES_PASSWORD: dbms_password
      POSTGRES_DB: benchmark_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=512MB
               -c work_mem=64MB
               -c maintenance_work_mem=128MB
               -c synchronous_commit=off
               -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbms_user -d benchmark_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: g13-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbms_user
      MONGO_INITDB_ROOT_PASSWORD: dbms_password
      MONGO_INITDB_DATABASE: benchmark_db
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    command: --wiredTigerCacheSizeGB 1
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: g13-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: >
      redis-server --save "" --appendonly no --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
  redisdata:
